<!DOCTYPE html>
<html>
<head><title>Activation HotPlayer</title></head>
<body style="font-family:sans-serif; padding:20px; max-width:400px; margin:auto">
<h2>Activer mon abonnement</h2>
<input id="mac" placeholder="MAC ex: 00:1A:79:..." style="width:100%; padding:12px"><br><br>
<input id="playlist" placeholder="Lien M3U Xtream" style="width:100%; padding:12px"><br><br>
<select id="plan" style="width:100%; padding:12px">
  <option value="1">1 An - 1 crédit</option>
  <option value="2.5">À vie - 2.5 crédits</option>
</select><br><br>
<button onclick="activer()" style="width:100%; padding:15px; background:green; color:white; border:0">ACTIVER MAINTENANT</button>
<p id="msg"></p>
<script>
async function activer(){
  const mac = document.getElementById('mac').value;
  const playlist = document.getElementById('playlist').value;
  const msg = document.getElementById('msg');
  msg.innerText = "Activation en cours...";
  const res = await fetch('/api/activate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({mac, playlist})
  });
  const data = await res.json();
  msg.innerText = data.success ? "✅ Activé ! Redémarre ton app" : "❌ Erreur: "+data.error;
}
</script>
</body>
</html>
